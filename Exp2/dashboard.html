<!DOCTYPE html>
<html lang="en" id="html" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="grid md:grid-cols-[250px_1fr] md:grid-rows-[60px_1fr] h-screen transition-colors duration-300">

  <!-- Sidebar -->
  <aside id="sidebar"
    class="bg-gray-200 dark:bg-gray-800 p-5 md:row-span-2 fixed md:static top-0 left-0 h-full w-64 -translate-x-full md:translate-x-0 transition-transform duration-300 z-50">
    <h2 class="text-xl font-bold mb-4 text-gray-800 dark:text-gray-100">Dashboard</h2>
    <nav class="space-y-2 text-gray-700 dark:text-gray-300">
      <p>📊 Reports</p>
      <p>⚙️ Settings</p>
    </nav>
  </aside>

  <!-- Header -->
  <header
    class="bg-gray-200 dark:bg-gray-800 flex justify-between items-center px-6 md:col-span-1 md:row-span-1 h-[60px]">
    <div class="flex items-center space-x-3">
      <!-- Hamburger for mobile -->
      <button id="menu-toggle" class="md:hidden px-3 py-2 bg-gray-300 dark:bg-gray-700 rounded">
        ☰
      </button>
      <h1 class="text-lg font-semibold text-gray-800 dark:text-gray-100">Admin Panel</h1>
    </div>
    <button id="theme-toggle" class="px-4 py-2 rounded bg-blue-600 text-white">Toggle Theme</button>
  </header>

  <!-- Main Content -->
  <main
    class="p-6 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 md:col-span-1 md:row-span-1 overflow-y-auto">
    <h2 class="text-xl font-semibold mb-4">Data Visualization</h2>
    <div
      class="h-48 bg-gray-300 dark:bg-gray-700 rounded mb-4 flex items-center justify-center text-lg font-medium">
      Chart 1
    </div>
    <div
      class="h-48 bg-gray-300 dark:bg-gray-700 rounded flex items-center justify-center text-lg font-medium">
      Chart 2
    </div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
