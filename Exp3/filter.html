<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Filter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 bg-gray-100 min-h-screen">
  <h1 class="text-2xl font-bold mb-4">Product Filter</h1>

  <label for="category" class="block mb-2 font-medium">Choose Category:</label>
  <select id="category" class="p-2 border rounded mb-6">
    <option value="all">All</option>
    <option value="electronics">Electronics</option>
    <option value="clothing">Clothing</option>
    <option value="books">Books</option>
  </select>

  <div class="grid gap-4 grid-cols-2 md:grid-cols-3 lg:grid-cols-4" id="product-list"></div>

  <script src="filter.js"></script>
</body>
</html>
